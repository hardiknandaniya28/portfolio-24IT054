version: '3.8'

services:
  # 1. MongoDB Database Service (Official Mongo Image + Named Volume)
  mongodb:
    image: mongo:latest
    container_name: task-manager-mongodb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - app-network

  # 2. Node.js Express Backend Service (Connects via service name 'mongodb')
  backend:
    build:
      context: ./task-manager-api-24IT054
      dockerfile: Dockerfile
    container_name: task-manager-backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/taskdb
      - JWT_SECRET=awdf_practical7_super_secret_jwt_key_2026
    depends_on:
      - mongodb
    networks:
      - app-network

  # 3. React Frontend Service (Multi-Stage Build served on port 5173)
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: task-manager-frontend
    restart: always
    ports:
      - "5173:5173"
    depends_on:
      - backend
    networks:
      - app-network

# Internal Docker bridge network for inter-container communication
networks:
  app-network:
    driver: bridge

# Named persistent volume so MongoDB data persists across container restarts
volumes:
  mongo-data:
    driver: local

